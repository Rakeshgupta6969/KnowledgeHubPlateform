services:
  # KnowledgeHub Express API
  - type: web
    name: knowledgehub-api
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm ci && npx prisma generate
    startCommand: npx prisma migrate deploy && node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: knowledgehub-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: knowledgehub-redis
          property: connectionString
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false

  # KnowledgeHub React Vite Client
  - type: web
    name: knowledgehub-client
    runtime: static
    plan: starter
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: knowledgehub-postgres
    plan: starter
    postgresMajorVersion: 16

  - name: knowledgehub-redis
    plan: starter
